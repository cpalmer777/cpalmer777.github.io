<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Book cover</title>
    <link rel="stylesheet" href="style.css">
    <!-- Order: A-Frame, then MindAR's A-Frame build, then our component. -->
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script>
      AFRAME.registerComponent("play-on-target", {
        init: function () {
          const video = document.querySelector("#book-video");
          this.el.addEventListener("targetFound", () => {
            video.play().catch(() => {});
          });
          this.el.addEventListener("targetLost", () => {
            video.pause();
          });
        }
      });
    </script>
  </head>
  <body>
    <div id="splash">
      <h1>Hold the book up to the camera</h1>
      <p>The cover is the key. When the camera sees it, the video plays on the book.</p>
      <button id="start" type="button" disabled>Start camera</button>
      <img src="assets/qr.png" width="180" height="180" alt="QR code opening this page">
      <p class="url">https://cpalmer777.github.io/</p>
    </div>

    <a-scene
      mindar-image="imageTargetSrc: assets/cert.mind; autoStart: false; uiScanning: no; uiLoading: no; uiError: no;"
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded>
      <a-assets>
        <video
          id="book-video"
          src="assets/book.mp4"
          preload="auto"
          loop
          playsinline
          webkit-playsinline></video>
      </a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0" play-on-target>
        <!-- Cover is 326×500. MindAR target width is 1. -->
        <a-video src="#book-video" position="0 0 0" width="1" height="1.533742"></a-video>
      </a-entity>
    </a-scene>

    <script>
      const splash = document.querySelector("#splash");
      const start = document.querySelector("#start");
      const scene = document.querySelector("a-scene");
      const video = document.querySelector("#book-video");

      scene.addEventListener("loaded", () => {
        start.disabled = false;
      });

      start.addEventListener("click", async () => {
        start.disabled = true;
        video.muted = false;
        try {
          await video.play();
          video.pause();
          video.currentTime = 0;
        } catch (err) {
          video.muted = true;
        }
        await scene.systems["mindar-image-system"].start();
        splash.hidden = true;
      });
    </script>
  </body>
</html>
